# Self-hosting Juggle with PostgreSQL.
#
#   1. cp .env.example .env
#   2. pnpm secrets:generate   (or generate the two secrets yourself)
#   3. docker compose up -d
#
# The app applies migrations at startup because RUN_MIGRATIONS is true below.
# If you scale to more than one replica, set it to false and run migrations as
# a release step instead so instances don't migrate concurrently.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: juggle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: juggle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juggle -d juggle"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host by default: only the app needs to reach it.
    expose:
      - "5432"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://juggle:${POSTGRES_PASSWORD}@postgres:5432/juggle
      RUN_MIGRATIONS: "true"
      APP_URL: ${APP_URL:?set APP_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?run pnpm secrets:generate}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set a dashboard password in .env}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:?set your provider keys in .env}
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:?run pnpm secrets:generate}
      GEMINI_QUOTA_GROUP: ${GEMINI_QUOTA_GROUP:-}
      # Behind a reverse proxy that sets x-forwarded-for, set this to true.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres-data:
